<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Pricing Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <div class="header-row">
            <div>
                <h1>LLM Pricing Dashboard</h1>
                <p class="subtitle">Compare pricing across platforms and providers (per 1M tokens)</p>
            </div>
            <button class="refresh-btn" id="refresh-btn" title="Refresh prices from all platforms">Refresh</button>
        </div>

        <!-- Search Bar -->
        <div class="search-bar glass-card">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input type="text" id="search" placeholder="搜索模型名称、供应商...">
        </div>

        <!-- Filter Panel -->
        <div class="filter-panel glass-card">
            <div class="filter-section">
                <div class="filter-header">
                    <span class="filter-title">平台</span>
                </div>
                <div class="filter-grid filter-grid-2" id="platform-filters"></div>
            </div>
            <div class="filter-divider"></div>
            <div class="filter-section">
                <div class="filter-header">
                    <span class="filter-title">供应商</span>
                    <button class="filter-reset" id="reset-provider">重置</button>
                </div>
                <div class="filter-grid filter-grid-auto" id="filters"></div>
            </div>
            <div class="filter-divider"></div>
            <div class="filter-section">
                <div class="filter-header">
                    <span class="filter-title">模型类型</span>
                </div>
                <div class="filter-grid filter-grid-3" id="type-filters"></div>
            </div>
        </div>

        <div class="table-wrap">
            <table id="pricing-table">
                <thead>
                    <tr>
                        <th data-sort="platform">Platform</th>
                        <th data-sort="provider">Provider</th>
                        <th data-sort="model">Model</th>
                        <th data-sort="model_type">Type</th>
                        <th data-sort="input_price">Input $/1M</th>
                        <th data-sort="output_price">Output $/1M</th>
                        <th data-sort="context_window">Context</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>

        <p class="updated" id="updated"></p>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
