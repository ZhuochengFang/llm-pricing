services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: llmpricing
      POSTGRES_PASSWORD: llmpricing
      POSTGRES_DB: llmpricing
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmpricing"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql://llmpricing:llmpricing@db:5432/llmpricing"
      #HTTPS_PROXY: "http://host.docker.internal:7890"
      #HTTP_PROXY: "http://host.docker.internal:7890"
      #NO_PROXY: "localhost,127.0.0.1,db"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - price-data:/app/backend/data
      - ./backend:/app/backend
      - ./frontend:/app/static

volumes:
  price-data:
  pgdata:
